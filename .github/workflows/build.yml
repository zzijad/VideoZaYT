name: Build VideoZaYT

# Release ide automatski: povecaj <Version> u VideoZaYT/VideoZaYT.csproj i pushaj na main.
# Ako tag v<verzija> vec postoji, nista se ne builda (stedi minute i prostor).
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          VER=$(grep -oP '(?<=<Version>)[^<]+' "VideoZaYT/VideoZaYT.csproj" | head -1)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VER" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"; echo "v$VER vec postoji"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"; echo "Novi release v$VER"
          fi

  build:
    needs: check
    if: needs.check.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish VideoZaYT/VideoZaYT.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish

      - name: Release v${{ needs.check.outputs.version }}
        if: needs.check.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: VideoZaYT v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: publish/VideoZaYT.exe

      - name: Artifact (samo rucni build bez nove verzije, cuva se 1 dan)
        if: needs.check.outputs.release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: VideoZaYT
          path: publish/VideoZaYT.exe
          retention-days: 1
