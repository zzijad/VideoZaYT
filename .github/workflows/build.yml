{
  "name": "Build",
  "on": ["push", "workflow_dispatch"],
  "permissions": { "contents": "write" },
  "jobs": {
    "build": {
      "runs-on": "windows-latest",
      "steps": [
        { "uses": "actions/checkout@v4" },
        { "uses": "actions/setup-dotnet@v4", "with": { "dotnet-version": "10.0.x" } },
        { "name": "Publish", "run": "dotnet publish VideoZaYT/VideoZaYT.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish" },
        { "uses": "actions/upload-artifact@v4", "with": { "name": "VideoZaYT", "path": "publish/VideoZaYT.exe" } },
        { "name": "Release", "if": "startsWith(github.ref, 'refs/tags/v')", "uses": "softprops/action-gh-release@v2", "with": { "files": "publish/VideoZaYT.exe" } }
      ]
    }
  }
}
